plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    mavenCentral()
    maven {
        name 'NeoForge Maven'
        url 'https://maven.neoforged.net/releases'
    }
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
}

version = "${mod_version}"
group = 'pyre.tinkerslevellingaddon'
base {
    archivesName = "TinkersLevellingAddon-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', 'tinkerslevellingaddon'
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', 'tinkerslevellingaddon'
            programArguments.add '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', 'tinkerslevellingaddon'
        }

        data {
            data()
            programArguments.addAll '--mod', 'tinkerslevellingaddon', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        tinkerslevellingaddon {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation fileTree(dir: '../Mantle-NeoForge/build/libs', include: 'Mantle-*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])
    implementation fileTree(dir: '../TinkersConstruct-NeoForge/build/libs', include: 'TinkersConstruct-*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])

    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            version: mod_version,
            loader_range: loader_range,
            minecraft_range: minecraft_range,
            neoforge_range: neoforge_range,
            tinkers_range: tinkers_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "tinkerslevellingaddon",
                "Specification-Vendor"    : "Pyre540",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "Pyre540",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
